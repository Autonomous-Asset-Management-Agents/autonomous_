        <h1>autonomous_ trading (AAAgents) — Open-Source Execution Framework for Your Own Trading Strategy</h1>
        <p>
          <strong>autonomous_ trading (AAAgents)</strong> is a self-hosted, local-first open-source (Apache-2.0) execution framework built in Germany (Europe) for rules-based algorithmic stock trading with Python, LangGraph, Electron and SQLite. You define, configure and enable your own trading strategy from deterministic rules, quant analytics and machine learning, and you keep every decision. The software executes your rules automatically, bounded by hard risk limits and an immediate kill-switch, and logs every order decision to a tamper-evident SHA-256 JSONL audit log.
        </p>
        <ul>
          <li><strong>Decisions:</strong> 14 agents in total, 8 of them cast a directional vote; you define the rules and hold every decision.</li>
          <li><strong>Broker &amp; Default Mode:</strong> Alpaca (US equities in USD, your own account) with paper mode (simulated trading without real money) enabled by default; live trading requires a deliberate, separately confirmed switch.</li>
          <li><strong>What it is NOT:</strong> AAAgents is a software tool — it gives no investment advice, does not pick stocks or investments, takes no mandate, does not manage portfolios or funds on your behalf, is not a robo-advisor or retirement savings plan, and promises no return or financial outcome.</li>
          <li><strong>Risk Ownership:</strong> Market, strategy and model risk remain entirely with you. Trading with real money can result in financial losses; hard risk limits and the kill-switch bound execution according to your rules, but do not protect against market losses and guarantee no outcome.</li>
          <li><strong>Links:</strong> <a href="https://autonomous-trading.de/llms.txt">LLMs.txt Summary</a> · <a href="https://github.com/Autonomous-Asset-Management-Agents/autonomous_">GitHub Source Code</a> · <a href="https://github.com/Autonomous-Asset-Management-Agents/autonomous_/releases">Desktop Installer Releases (Windows &amp; macOS)</a> · <a href="https://autonomous-trading.de/legal/risk-disclosure">Risk Disclosure</a></li>
