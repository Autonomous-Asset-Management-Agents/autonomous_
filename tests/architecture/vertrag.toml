"core/simulation.py" = { submit_order = 1 }
"core/simulation_adapter.py" = { cancel_orders = 1, close_all_positions = 1, submit_order = 1 }
# Default-Strategie: Simulationszweig und Methodenverweis vor der Verzweigung.
"core/strategies/base.py" = { submit_order = 3 }

# ── 4. Keine Editionsweiche ausserhalb der Composition Root ──────────────────
