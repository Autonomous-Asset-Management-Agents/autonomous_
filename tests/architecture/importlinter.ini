# #3394 (ARC-E3) — Stufengrenzen der Value Chain als Import-Vertraege.
#
# Die Zuordnung der Module zu den Stufen stammt aus den Stufenbeschreibungen unter
# docs/0_strategy_and_roadmap/value_chain/ (vc1_research.md nennt core/round_table und
# core/orchestration, vc3_execution.md den Order-Pfad; core/contracts sind die Uebergabe-
# Typen aller Stufen). Ein Vertrag gilt fuer direkte UND indirekte Importe.
#
# ignore_imports friert ein, was heute schon ueber eine Grenze greift. Die Liste darf nur
# schrumpfen: Ein Eintrag, der im Graphen nicht mehr vorkommt, ist ein Fehler
# (unmatched_ignore_imports_alerting = error) — er muss dann gestrichen werden.
# Eingefroren wird jeweils die Kante, an der die Grenze verlassen wird, nicht irgendeine
# Kante tiefer im Pfad.
#
# Geprueft von tests/unit/test_architektur_fitness.py.

[importlinter]
root_package = core
include_external_packages = False

[importlinter:contract:uebergaben-sind-blaetter]
name = Uebergabe-Vertraege (core.contracts) haengen von keiner Stufe ab
type = forbidden
source_modules = core.contracts
forbidden_modules =
    core.engine
    core.gateway
    core.outbox
    core.risk_manager
    core.compliance
    core.kill_switch
    core.portfolio_manager
    core.round_table
    core.orchestration

[importlinter:contract:recherche-sendet-nicht]
name = VC-1 Recherche (round_table, orchestration) erreicht die Ausfuehrung (VC-3) nicht
type = forbidden
source_modules =
    core.round_table
    core.orchestration
forbidden_modules =
    core.gateway
    core.outbox
    core.broker_stops
    core.engine.order_executor
ignore_imports =
    core.orchestration.graph -> core.agent_registry
    core.round_table.agents -> core.agent_registry
    core.round_table.agents -> core.specialist_registry
    core.round_table.runner -> core.agent_registry
    core.round_table.runner -> core.risk_manager

[importlinter:contract:gateway-kennt-engine-nicht]
name = VC-3 Gateway kennt weder die Engine noch die Recherche
type = forbidden
source_modules = core.gateway
forbidden_modules =
    core.engine
    core.round_table
    core.orchestration
ignore_imports =
    core.hitl_gate -> core.round_table.runner
    core.hitl_gate -> core.round_table.senate_log

[importlinter:contract:kein-kern-importiert-adapter]
name = Kein Kernmodul importiert einen Adapter (ausserhalb der Composition Root)
type = forbidden
source_modules = core
forbidden_modules = core.adapters
ignore_imports =
    core.composition.root -> core.adapters.sql_state_adapter
    core.composition.root -> core.adapters.alpaca_broker_adapter
    core.composition.root -> core.adapters.system_clock
